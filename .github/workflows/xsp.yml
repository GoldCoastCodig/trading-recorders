# XSP same-day options every 5 minutes, 09:30-12:00 New York, Monday-Friday (recorder/xsp_recorder.py).
# Started by cron-job.org at 07:25 Mountain; the schedules below are only free backups. Runs about 2 h 40 min
# (free here: public repositories have unlimited Actions minutes). Data goes to the private repository (DATA_TOKEN).
name: XSP options

on:
  schedule:
    - cron: "25 13 * * 1-5"   # 09:25 EDT
    - cron: "25 14 * * 1-5"   # 09:25 EST
  workflow_dispatch:
    inputs:
      mode:
        description: "test = 3 snapshots now under test/xsp (market hours); normal"
        default: test
        type: choice
        options: [test, normal]

permissions:
  contents: read

concurrency:
  group: xsp-recorder
  cancel-in-progress: false

jobs:
  record:
    if: github.repository_owner == 'GoldCoastCodig'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2, pinned
        with:
          persist-credentials: false
      - name: Get the data branch (private repository)
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          git clone --quiet --depth 1 --branch market-data \
            "https://x-access-token:${DATA_TOKEN}@github.com/GoldCoastCodig/Trading-Research.git" data
          git -C data config user.name "recorder"
          git -C data config user.email "actions@users.noreply.github.com"
      - name: Record XSP options
        env:
          TT_CLIENT_ID: ${{ secrets.TT_CLIENT_ID }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
        run: |
          FLAG=""
          [ "${{ github.event.inputs.mode }}" = "test" ] && FLAG="--test"
          python3 -u recorder/xsp_recorder.py --out data $FLAG
