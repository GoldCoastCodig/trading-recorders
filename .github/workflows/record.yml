# Daily recorders: expected move (15:30 Mountain), market context, economic calendar (04:45 Mountain).
# Phone feeds (ntfy topics, all GitHub secrets): NTFY_TOPIC expected move, NTFY_TOPIC_CALENDAR news calendar,
# NTFY_TOPIC_STATUS failures; an unset feed falls back to NTFY_TOPIC. News results: news.yml.
# Started on time by cron-job.org ("run workflow"); the schedules below are only free backups.
# The collected data is NOT stored here: it is pushed to the owner's private repository with the DATA_TOKEN secret.
# Security: no pull-request triggers; secrets are only given to runs started by the owner; read-only token here.
name: Record

on:
  schedule:
    - cron: "27,37,47,57 21 * * 1-5"  # expected move backups, 15:27-15:57 MDT
    - cron: "27,37,47,57 22 * * 1-5"  # expected move backups, 15:27-15:57 MST
    - cron: "13 0 * * 2-6"            # last expected-move backup
    - cron: "41 10,11 * * 1-5"        # economic calendar backup, weekdays 04:41 Mountain
    - cron: "51 21 * * 0"             # economic calendar backup, Sundays 14:51 MST / 15:51 MDT (week ahead)
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = expected move (records once per day from 15:25 MT); test; force; history; context; context-test; calendar; calendar-test; news-test = one TEST message per news source (news.yml does the real runs)"
        default: test
        type: choice
        options: [test, force, normal, history, context, context-test, calendar, calendar-test, news-test]

permissions:
  contents: read

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  record:
    if: github.repository_owner == 'GoldCoastCodig'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2, pinned
        with:
          persist-credentials: false
      - name: Get the data branch (private repository)
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          git clone --quiet --depth 1 --branch market-data \
            "https://x-access-token:${DATA_TOKEN}@github.com/GoldCoastCodig/Trading-Research.git" data
      - name: Record
        env:
          TT_CLIENT_ID: ${{ secrets.TT_CLIENT_ID }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_REFRESH_TOKEN: ${{ secrets.SCHWAB_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_CALENDAR: ${{ secrets.NTFY_TOPIC_CALENDAR }}
          NTFY_TOPIC_STATUS: ${{ secrets.NTFY_TOPIC_STATUS }}
        run: |
          MODE="${{ github.event.inputs.mode || 'normal' }}"
          case "${{ github.event.schedule }}" in "41 10,11 * * 1-5"|"51 21 * * 0") MODE="calendar";; esac
          if [ "$MODE" = "calendar" ]; then python3 recorder/econ_calendar.py --out data --notify; exit 0; fi
          if [ "$MODE" = "calendar-test" ]; then python3 recorder/econ_calendar.py --out data --test; exit 0; fi
          if [ "$MODE" = "news-test" ]; then NTFY_TOPIC_NEWS="${{ secrets.NTFY_TOPIC_NEWS }}" python3 recorder/news_watch.py --out data --test; exit 0; fi
          FLAG=""
          [ "$MODE" = "test" ] && FLAG="--test"
          [ "$MODE" = "force" ] && FLAG="--force"
          [ "$MODE" = "history" ] && FLAG="--history"
          [ "$MODE" = "context" ] && FLAG="--context"
          [ "$MODE" = "context-test" ] && FLAG="--context --test"
          python3 recorder/em_recorder.py --out data $FLAG
      - name: Save to the private data branch
        run: |
          cd data
          git config user.name "recorder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "Record $(TZ=America/Denver date +%F) (${{ github.event.inputs.mode || 'scheduled' }}, public runner)"
          for i in 1 2 3; do git push -q origin HEAD:market-data && exit 0; sleep 5; git pull -q --rebase origin market-data; done
          exit 1
      - name: Tell the status feed when this run failed
        if: failure()
        env:
          NTFY_TOPIC_STATUS: ${{ secrets.NTFY_TOPIC_STATUS }}
        run: |
          [ -z "$NTFY_TOPIC_STATUS" ] && exit 0
          curl -sS --retry 3 -H "Title: Recorder run FAILED (${{ github.event.inputs.mode || 'scheduled' }})" -H "Tags: warning" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "The Record run failed; tap to see the log. A later run or the PC backup may still record it." \
            "https://ntfy.sh/${NTFY_TOPIC_STATUS}"
